name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - k8s/**
      - scripts/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - scripts/**
      - .github/workflows/backend.yml
  workflow_dispatch: {}

permissions:
  contents: read

# Releases queue up instead of cancelling each other, so a digest is never half-recorded.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Kubernetes manifests render
        run: kubectl kustomize k8s/overlays/kassa-prod > /dev/null

  release:
    name: Build image and record release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < backend/VERSION)"
          build_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io:443/${owner}/ghesta-server:${version}-prod.${build_id}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io:443
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plan.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.plan.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify published digest
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          actual="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$DIGEST"

      - name: Pin the digest for Argo CD
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD_ID: ${{ steps.plan.outputs.build_id }}
        run: |
          set -euo pipefail
          python3 scripts/record_release.py \
            --image "$IMAGE" --digest "$DIGEST" --version "$VERSION" \
            --build-id "$BUILD_ID" --source-revision "$GITHUB_SHA"
          kubectl kustomize k8s/overlays/kassa-prod > /dev/null
          git config user.name "ghesta-release"
          git config user.email "ghesta-release@users.noreply.github.com"
          git add k8s/overlays/kassa-prod/image-patch.yaml k8s/overlays/kassa-prod/release.json
          git commit -m "chore(deploy): ghesta-server ${VERSION} build ${BUILD_ID} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the release commit" >&2
          exit 1

      - name: Summary
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: %s@%s\nArgo CD deploys the committed digest.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
