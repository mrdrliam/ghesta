# Only Traefik may reach the server; nothing else in the cluster needs it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghesta-server-ingress
spec:
  podSelector:
    matchLabels:
      app: ghesta-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
