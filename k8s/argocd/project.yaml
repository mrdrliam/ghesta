apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ghesta
  namespace: argocd
spec:
  description: Ghesta sync server on kassa-prod
  sourceRepos:
    - https://github.com/mrdrliam/ghesta.git
  destinations:
    - namespace: ghesta
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cert-manager.io
      kind: Certificate
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: Secret
        name: "*"
