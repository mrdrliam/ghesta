apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghesta-prod
  namespace: argocd
spec:
  project: ghesta
  source:
    repoURL: https://github.com/mrdrliam/ghesta.git
    targetRevision: main
    path: k8s/overlays/kassa-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ghesta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
